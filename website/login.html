{% extends "base.html" %}
<!-- Student: Mostafa Abdelkarim | Student ID: 24061953 | Module: UFCFES-30-1 -->
{% block title %}Sign In | Bristol Community Events{% endblock %}

{% block content %}

<div class="booking-container">
    <div class="booking-wrapper">
        <h1>Sign In</h1>
        <p class="auth-subtitle">Welcome back. Sign in to manage your bookings.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Your password" required autocomplete="current-password"
                           style="padding-right:3rem;">
                    <button type="button" onclick="togglePassword()"
                            style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light);padding:0;"
                            aria-label="Show/hide password">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <p style="text-align:center;margin-top:1.25rem;color:var(--text-light);">
            Don't have an account?
            <a href="{{ url_for('register') }}" style="color:var(--uwe-red);font-weight:600;">Register free</a>
        </p>
    </div>
</div>

<script>
function togglePassword() {
    var input = document.getElementById('password');
    var icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
}
</script>

{% endblock %}
